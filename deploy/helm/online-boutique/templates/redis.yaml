apiVersion: v1
kind: Service
metadata:
  name: redis-cart
spec:
  selector: { app: redis-cart }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-cart }
  template:
    metadata:
      labels: { app: redis-cart }
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image }}"
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
