global:
  awsAccountId: "replace-with-account-id"
  awsRegion: us-east-1
  imageTag: "replace-with-commit-sha"

frontend:
  serviceType: LoadBalancer

services:
  adservice: { port: 9555, replicas: 1, env: { PORT: "9555" } }
  cartservice: { port: 7070, replicas: 1, env: { REDIS_ADDR: "redis-cart:6379" } }
  checkoutservice:
    port: 5050
    replicas: 1
    env:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      PAYMENT_SERVICE_ADDR: "paymentservice:50051"
      EMAIL_SERVICE_ADDR: "emailservice:8080"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
  currencyservice: { port: 7000, replicas: 1, env: { PORT: "7000", DISABLE_PROFILER: "1" } }
  emailservice: { port: 8080, replicas: 1, env: { PORT: "8080", DISABLE_PROFILER: "1" } }
  frontend:
    port: 8080
    replicas: 1
    env:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
      RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
      AD_SERVICE_ADDR: "adservice:9555"
      ENV_PLATFORM: "aws"
      DISABLE_PROFILER: "1"
  loadgenerator: { port: 0, replicas: 1, env: { FRONTEND_ADDR: "frontend:80", USERS: "10" } }
  paymentservice: { port: 50051, replicas: 1, env: { PORT: "50051", DISABLE_PROFILER: "1" } }
  productcatalogservice: { port: 3550, replicas: 1, env: { PORT: "3550", DISABLE_PROFILER: "1" } }
  recommendationservice: { port: 8080, replicas: 1, env: { PORT: "8080", PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550", DISABLE_PROFILER: "1" } }
  shippingservice: { port: 50051, replicas: 1, env: { PORT: "50051", DISABLE_PROFILER: "1" } }

redis:
  image: redis:alpine
  storage: 1Gi
